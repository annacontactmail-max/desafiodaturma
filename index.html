<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ff">
  <meta name="description" content="Desafio da Turma — pontuação, progresso e prémios">

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f5ff;
      --card: #ffffff;
      --text: #26304a;
      --muted: #7b8299;
      --primary: #7567e8;
      --primary-soft: #eeeaff;
      --green: #55b889;
      --green-soft: #e5f7ef;
      --orange: #f3aa55;
      --orange-soft: #fff1df;
      --red: #e77b88;
      --red-soft: #fdebed;
      --border: #eceaf4;
      --shadow: 0 10px 30px rgba(56, 48, 100, .08);
      --radius: 24px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, #eeeaff 0, transparent 28%),
        radial-gradient(circle at 95% 15%, #e8f8f0 0, transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      max-width: 1050px;
      margin: auto;
      padding: 28px 20px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      margin-bottom: 3px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 42px);
      letter-spacing: -.04em;
    }

    h2 {
      margin: 0;
      font-size: 19px;
    }

    h3 {
      margin: 24px 0 12px;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 0 20px 50px;
    }

    .iconBtn {
      border: 0;
      background: white;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      font-size: 20px;
    }

    .scoreCard {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #7567e8, #9185f0);
      color: white;
      border-radius: 32px;
      padding: 30px;
      box-shadow: 0 18px 45px rgba(117, 103, 232, .25);
      margin: 8px 0 20px;
    }

    .scoreCard::after {
      content: "★";
      position: absolute;
      right: 28px;
      top: 8px;
      font-size: 120px;
      opacity: .08;
      transform: rotate(15deg);
    }

    .score {
      position: relative;
      z-index: 1;
      font-size: clamp(70px, 16vw, 120px);
      line-height: .9;
      font-weight: 850;
      letter-spacing: -.07em;
    }

    .scoreLabel {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .16em;
      opacity: .8;
    }

    .progress {
      position: relative;
      z-index: 1;
      height: 13px;
      background: rgba(255,255,255,.28);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 25px;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: inherit;
      transition: width .5s ease;
    }

    #nextText {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      font-size: 14px;
      font-weight: 650;
      opacity: .92;
    }

    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-top: 18px;
      box-shadow: var(--shadow);
    }

    .sectionHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .actions button {
      min-height: 82px;
      border: 0;
      border-radius: 20px;
      background: var(--green-soft);
      color: #318363;
      font-size: 24px;
      font-weight: 850;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .actions button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(70,130,100,.12);
    }

    #negativeActions button {
      background: var(--red-soft);
      color: #c45867;
    }

    .levels {
      display: grid;
      gap: 12px;
      margin-top: 17px;
    }

    .level {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: #fbfaff;
    }

    .level.active {
      background: var(--primary-soft);
      border-color: #d8d2ff;
    }

    .celebration {
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 20px;
      background: var(--orange-soft);
      color: #a8681e;
      text-align: center;
      font-weight: 800;
      animation: pop .4s ease;
    }

    @keyframes pop {
      0% { transform: scale(.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hidden {
      display: none !important;
    }

    .smallBtn {
      border: 0;
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 750;
    }

    #history {
      margin-top: 14px;
    }

    #history > * {
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      margin-top: 14px;
    }

    .danger {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px;
      background: var(--red-soft);
      color: #c45867;
      font-weight: 750;
      margin-top: 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(38, 35, 55, .45);
      padding: 18px;
      display: grid;
      place-items: center;
    }

    .modalBox {
      width: min(620px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.2);
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 700;
      color: var(--text);
    }

    input {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    @media (max-width: 700px) {
      .topbar {
        padding-top: 20px;
      }

      main {
        padding: 0 14px 35px;
      }

      .scoreCard {
        padding: 25px;
        border-radius: 26px;
      }

      .card {
        padding: 18px;
        border-radius: 21px;
      }

      .actions {
        grid-template-columns: repeat(3, 1fr);
      }

      .actions button {
        min-height: 72px;
      }
    }

    @media (max-width: 420px) {
      .actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .actions button {
        min-height: 68px;
      }
    }
  </style>

  <title>Desafio da Turma</title>
</head>

<body>

<header class="topbar">
  <div>
    <div class="eyebrow">🏆 DESAFIO DA</div>
    <h1 id="classTitle">Turma</h1>
  </div>

  <button id="adminBtn" class="iconBtn" aria-label="Abrir administração">
    ⚙️
  </button>
</header>

<main>

  <section class="scoreCard">
    <div class="score" id="score">0</div>
    <div class="scoreLabel">PONTOS DA TURMA</div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <p id="nextText">Próximo objetivo: —</p>
  </section>

  <section id="celebration" class="celebration hidden"></section>

  <section class="card">
    <div class="sectionHead">
      <h2>🎁 Níveis e prémios</h2>
    </div>

    <div id="levels" class="levels"></div>
  </section>

  <section class="card">
    <div class="sectionHead">
      <h2>✨ Ganhar pontos</h2>
    </div>

    <div id="positiveActions" class="actions"></div>
  </section>

  <section class="card">
    <div class="sectionHead">
      <h2>↘️ Retirar pontos</h2>
    </div>

    <div id="negativeActions" class="actions"></div>
  </section>

  <section class="card">
    <div class="sectionHead">
      <h2>📋 Histórico</h2>
      <button id="clearHistory" class="smallBtn">Limpar</button>
    </div>

    <div id="history"></div>
  </section>

</main>

<div id="adminModal" class="modal hidden">

  <div class="modalBox">

    <div class="sectionHead">
      <h2>⚙️ Administração</h2>
      <button id="closeAdmin" class="iconBtn">✕</button>
    </div>

    <div id="pinArea">
      <label>
        PIN do professor
        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          maxlength="8"
          placeholder="1234">
      </label>

      <button id="unlockBtn" class="primary">
        Entrar
      </button>
    </div>

    <form id="adminForm" class="hidden">

      <label>
        Nome da turma
        <input id="classInput">
      </label>

      <label>
        PIN do professor
        <input
          id="newPinInput"
          type="text"
          inputmode="numeric"
          maxlength="8">
      </label>

      <h3>🎁 Prémios</h3>

      <div id="levelInputs"></div>

      <button class="primary" type="submit">
        Guardar alterações
      </button>

      <button id="resetBtn" class="danger" type="button">
        Repor dados de exemplo
      </button>

    </form>

  </div>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
