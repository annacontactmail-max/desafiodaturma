<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Desafio da Turma — pontuação e prémios">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Desafio da Turma</title>
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">🏆 DESAFIO DA</div><h1 id="classTitle">Turma</h1></div>
  <button id="adminBtn" class="iconBtn" aria-label="Abrir administração">⚙️</button>
</header>

<main>
  <section class="scoreCard">
    <div class="score" id="score">0</div>
    <div class="scoreLabel">PONTOS</div>
    <div class="progress"><div id="progressBar"></div></div>
    <p id="nextText">Próximo objetivo: —</p>
  </section>

  <section id="celebration" class="celebration hidden"></section>

  <section class="card">
    <h2>🎁 Percurso de prémios</h2>
    <div id="levels" class="levels"></div>
  </section>

  <section class="card">
    <h2>➕ Ganhar pontos</h2>
    <div id="positiveActions" class="actions"></div>
  </section>

  <section class="card">
    <h2>➖ Perder pontos</h2>
    <div id="negativeActions" class="actions"></div>
  </section>

  <section class="card">
    <div class="sectionHead"><h2>📋 Histórico</h2><button id="clearHistory" class="smallBtn">Limpar</button></div>
    <div id="history"></div>
  </section>
</main>

<div id="adminModal" class="modal hidden">
  <div class="modalBox">
    <div class="sectionHead"><h2>⚙️ Administração</h2><button id="closeAdmin" class="iconBtn">✕</button></div>
    <div id="pinArea">
      <label>PIN do professor<input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="1234"></label>
      <button id="unlockBtn" class="primary">Entrar</button>
    </div>
    <form id="adminForm" class="hidden">
      <label>Nome da turma<input id="classInput"></label>
      <label>PIN do professor<input id="newPinInput" type="text" inputmode="numeric" maxlength="8"></label>
      <h3>Prémios</h3>
      <div id="levelInputs"></div>
      <button class="primary" type="submit">Guardar alterações</button>
      <button id="resetBtn" class="danger" type="button">Repor dados de exemplo</button>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
