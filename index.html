<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#f7f5ff">
  <meta name="description" content="Desafio da Turma — pontuação, progresso e prémios">

  <link rel="manifest" href="manifest.json">

  <title>Desafio da Turma</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f5ff;
      --card: #ffffff;
      --text: #29324d;
      --muted: #7c849b;
      --primary: #7567e8;
      --primary-dark: #5d50cc;
      --primary-soft: #eeeaff;
      --green: #55b889;
      --green-soft: #e8f8f0;
      --orange: #f2aa57;
      --orange-soft: #fff2df;
      --red: #e47c89;
      --red-soft: #fdebed;
      --border: #ebe8f4;
      --shadow: 0 12px 35px rgba(62, 54, 110, .08);
      --radius: 25px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 0%, #eeeaff 0, transparent 30%),
        radial-gradient(circle at 100% 15%, #e7f8ef 0, transparent 27%),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .topbar {
      max-width: 1080px;
      margin: auto;
      padding: 25px 20px 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .13em;
      margin-bottom: 3px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 43px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.02em;
    }

    h3 {
      margin: 25px 0 12px;
    }

    main {
      max-width: 1080px;
      margin: auto;
      padding: 0 20px 55px;
    }

    .iconBtn {
      border: 0;
      background: rgba(255,255,255,.95);
      width: 50px;
      height: 50px;
      border-radius: 17px;
      box-shadow: var(--shadow);
      font-size: 20px;
      transition: transform .15s ease;
    }

    .iconBtn:active {
      transform: scale(.94);
    }

    /* SCORE */

    .scoreCard {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #7567e8, #9489f1);
      color: white;
      border-radius: 32px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(117,103,232,.25);
      margin: 8px 0 20px;
    }

    .scoreCard::before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: -70px;
      top: -80px;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
    }

    .scoreCard::after {
      content: "★";
      position: absolute;
      right: 24px;
      bottom: -35px;
      font-size: 145px;
      opacity: .07;
      transform: rotate(12deg);
    }

    .score {
      position: relative;
      z-index: 1;
      font-size: clamp(76px, 17vw, 125px);
      line-height: .85;
      font-weight: 900;
      letter-spacing: -.075em;
    }

    .scoreLabel {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      font-weight: 850;
      font-size: 13px;
      letter-spacing: .15em;
      opacity: .82;
    }

    .progress {
      position: relative;
      z-index: 1;
      height: 14px;
      background: rgba(255,255,255,.27);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 25px;
    }

    #progressBar {
      width: 0;
      height: 100%;
      background: white;
      border-radius: inherit;
      transition: width .55s cubic-bezier(.2,.8,.2,1);
    }

    #nextText {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      font-size: 14px;
      font-weight: 700;
      opacity: .94;
    }

    /* LAYOUT */

    .dashboardGrid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 18px;
    }

    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 23px;
      margin-top: 18px;
      box-shadow: var(--shadow);
    }

    .dashboardGrid .card {
      margin-top: 0;
    }

    .sectionHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    /* ACTIONS */

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 17px;
    }

    .action {
      min-height: 92px;
      border: 0;
      border-radius: 21px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
      transition:
        transform .12s ease,
        box-shadow .12s ease;
    }

    .action:active {
      transform: scale(.97);
    }

    .action.positive {
      background: var(--green-soft);
      color: #347f61;
    }

    .action.negative {
      background: var(--red-soft);
      color: #bf5a69;
    }

    .action .label {
      font-size: 14px;
      line-height: 1.25;
      font-weight: 750;
    }

    .action .value {
      margin-top: 7px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    /* LEVELS */

    .levels {
      display: grid;
      gap: 11px;
      margin-top: 17px;
    }

    .level {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 68px;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      background: #fcfbff;
      transition: .2s ease;
    }

    .level.unlocked {
      background: var(--primary-soft);
      border-color: #dcd6ff;
    }

    .level .emoji {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: white;
      border-radius: 14px;
      font-size: 22px;
      flex: 0 0 auto;
    }

    .level .info {
      flex: 1;
      min-width: 0;
    }

    .level .name {
      font-weight: 800;
      line-height: 1.2;
    }

    .level .pts {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .badge {
      white-space: nowrap;
      background: var(--green-soft);
      color: #348363;
      padding: 7px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 850;
    }

    /* CHART */

    .chartWrap {
      margin-top: 17px;
    }

    .chartHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .chartHeader strong {
      color: var(--primary);
      font-size: 20px;
    }

    .chart {
      position: relative;
      height: 245px;
      margin-top: 14px;
      border-radius: 19px;
      overflow: hidden;
      background: linear-gradient(180deg,#faf9ff,#fff);
    }

    .chartGrid {
      position: absolute;
      inset: 20px 0 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chartGrid span {
      width: 100%;
      border-top: 1px dashed #e9e6f3;
    }

    #progressChart {
      position: absolute;
      inset: 8px 0 0;
      width: 100%;
      height: calc(100% - 8px);
      color: var(--primary);
      overflow: visible;
    }

    .chartEmpty {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 15px 0;
    }

    /* CELEBRATION */

    .celebration {
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 20px;
      background: var(--orange-soft);
      color: #a86b20;
      text-align: center;
      font-weight: 850;
      animation: pop .4s ease;
      box-shadow: var(--shadow);
    }

    @keyframes pop {
      0% {
        transform: scale(.95);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .hidden {
      display: none !important;
    }

    /* HISTORY */

    .smallBtn {
      border: 0;
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
    }

    #history {
      margin-top: 14px;
    }

    .historyItem {
      display: grid;
      grid-template-columns: 75px 1fr auto auto;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .when {
      color: var(--muted);
      font-size: 11px;
    }

    .desc {
      font-size: 13px;
      font-weight: 700;
    }

    .delta {
      font-size: 16px;
      font-weight: 900;
    }

    .delta.pos {
      color: var(--green);
    }

    .delta.neg {
      color: var(--red);
    }

    .undo {
      border: 0;
      background: var(--primary-soft);
      color: var(--primary);
      width: 34px;
      height: 34px;
      border-radius: 11px;
      font-size: 17px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(38,35,55,.45);
      padding: 18px;
      display: grid;
      place-items: center;
    }

    .modalBox {
      width: min(620px,100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.2);
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 750;
    }

    input {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--primary);
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      background: var(--primary);
      color: white;
      font-weight: 850;
      margin-top: 14px;
    }

    .danger {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px;
      background: var(--red-soft);
      color: #c45867;
      font-weight: 800;
      margin-top: 10px;
    }

    .levelRow {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .dashboardGrid {
        grid-template-columns: 1fr;
      }

      .dashboardGrid .card {
        margin-top: 18px;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 20px 15px 15px;
      }

      main {
        padding: 0 14px 40px;
      }

      .scoreCard {
        padding: 25px;
        border-radius: 27px;
      }

      .card {
        padding: 18px;
        border-radius: 21px;
      }

      .actions {
        grid-template-columns: repeat(2,1fr);
      }

      .action {
        min-height: 84px;
      }

      .historyItem {
        grid-template-columns: 63px 1fr auto auto;
      }
    }

    @media (max-width: 380px) {
      .action .label {
        font-size: 13px;
      }

      .action .value {
        font-size: 24px;
      }

      .historyItem {
        grid-template-columns: 1fr auto auto;
      }

      .when {
        display: none;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div>
    <div class="eyebrow">🏆 DESAFIO DA</div>
    <h1 id="classTitle">Turma</h1>
  </div>

  <button id="adminBtn" class="iconBtn" aria-label="Abrir administração">
    ⚙️
  </button>
</header>

<main>

  <section class="scoreCard">

    <div class="score" id="score">0</div>

    <div class="scoreLabel">
      PONTOS DA TURMA
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <p id="nextText">
      Próximo objetivo: —
    </p>

  </section>

  <section id="celebration" class="celebration hidden"></section>

  <div class="dashboardGrid">

    <section class="card">

      <div class="sectionHead">
        <h2>🎁 Níveis e prémios</h2>
      </div>

      <div id="levels" class="levels"></div>

    </section>

    <section class="card">

      <div class="sectionHead">
        <h2>📈 Progresso</h2>
      </div>

      <div class="chartWrap">

        <div class="chartHeader">
          <span>Evolução da turma</span>
          <strong id="chartCurrentScore">0 pts</strong>
        </div>

        <div class="chart">

          <div class="chartGrid">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <svg
            id="progressChart"
            viewBox="0 0 600 220"
            preserveAspectRatio="none"
            aria-label="Gráfico de progresso">

            <defs>
              <linearGradient
                id="chartFill"
                x1="0"
                y1="0"
                x2="0"
                y2="1">

                <stop offset="0%" stop-opacity=".25"/>
                <stop offset="100%" stop-opacity="0"/>

              </linearGradient>
            </defs>

            <path
              id="chartArea"
              fill="url(#chartFill)"
              d="">
            </path>

            <polyline
              id="chartLine"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
              points="">
            </polyline>

            <g id="chartDots"></g>

          </svg>

        </div>

        <div id="chartEmpty" class="chartEmpty">
          Adiciona pontos para começar a ver a evolução da turma ✨
        </div>

      </div>

    </section>

  </div>

  <section class="card">

    <div class="sectionHead">
      <h2>✨ Ganhar pontos</h2>
    </div>

    <div id="positiveActions" class="actions"></div>

  </section>

  <section class="card">

    <div class="sectionHead">
      <h2>↘️ Retirar pontos</h2>
    </div>

    <div id="negativeActions" class="actions"></div>

  </section>

  <section class="card">

    <div class="sectionHead">
      <h2>📋 Histórico</h2>

      <button id="clearHistory" class="smallBtn">
        Limpar
      </button>
    </div>

    <div id="history"></div>

  </section>

</main>

<div id="adminModal" class="modal hidden">

  <div class="modalBox">

    <div class="sectionHead">
      <h2>⚙️ Administração</h2>

      <button id="closeAdmin" class="iconBtn">
        ✕
      </button>
    </div>

    <div id="pinArea">

      <label>
        PIN do professor

        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          maxlength="8"
          placeholder="1234">
      </label>

      <button id="unlockBtn" class="primary">
        Entrar
      </button>

    </div>

    <form id="adminForm" class="hidden">

      <label>
        Nome da turma
        <input id="classInput">
      </label>

      <label>
        PIN do professor
        <input
          id="newPinInput"
          type="text"
          inputmode="numeric"
          maxlength="8">
      </label>

      <h3>🎁 Prémios</h3>

      <div id="levelInputs"></div>

      <button class="primary" type="submit">
        Guardar alterações
      </button>

      <button id="resetBtn" class="danger" type="button">
        Repor dados de exemplo
      </button>

    </form>

  </div>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
